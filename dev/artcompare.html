<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>So hình cũ / mới</title>
<!-- Thử xem SVG vẽ kỹ (chuyển màu, bóng trong, bóng đổ, vân) đi được tới đâu
     so với hình phẳng hiện tại. Cỡ 46px là cỡ thật trong khay món. -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Baloo 2', sans-serif; background: #fff6e8; color: #4a382c; margin: 0; padding: 22px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  table { border-collapse: collapse; }
  td, th { padding: 10px 14px; text-align: center; }
  th { font-size: 12px; color: #8d7560; text-transform: uppercase; letter-spacing: .5px; }
  td.name { text-align: left; font-size: 14px; }
  .box { background: #fffdf7; border: 2px solid #eddbc0; border-radius: 14px; padding: 6px; display: inline-block; line-height: 0; }
  .lbl { font-size: 11px; color: #8d7560; margin-top: 4px; }
</style>
</head>
<body>
<h1>Hình cũ (trái) so với hình vẽ kỹ (phải)</h1>
<table id="t"></table>

<script src="../js/art.js"></script>
<script src="../js/data.js"></script>
<script>
/* ---- bản vẽ kỹ, thử nghiệm ---- */
const NEW = {
  /* Sườn cốt lết: miếng DẸT và RỘNG, không có cục xương lòi ra — chính cục
     xương ở bản cũ làm nó bị đọc thành đùi gà. Thêm viền mỡ xăn, vệt cháy
     chéo, và vệt bóng dầu để ra chất nướng. */
  suon: () => `
    <defs>
      <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d98c43"/><stop offset=".45" stop-color="#b3652b"/><stop offset="1" stop-color="#8a4a1d"/>
      </linearGradient>
      <radialGradient id="sh" cx=".35" cy=".3" r=".5">
        <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse cx="20" cy="31" rx="15" ry="3" fill="#000" opacity=".13"/>
    <path d="M6.5 19c-.5-5 3-9.5 8.5-10.5 5-1 9 .5 12 3 3.5 3 5.5 6.5 4.5 9.5-1 3.5-5 5.5-10 6-6 .5-11-1.5-13.5-4.5-1-1.2-1.4-2.4-1.5-3.5z"
      fill="url(#sg)" stroke="#6f3a15" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M6.6 20.5c2 2.5 6 4 11 3.8 5-.2 9-1.8 11.4-4.2-.2 3-4.2 5.4-9.4 5.9-6 .5-11-1.5-13-5.5z" fill="#6f3a15" opacity=".35"/>
    <path d="M12 9.4c1 4 1.6 9 1.2 14.6M18.6 8.6c.4 4.6.4 10-.4 15.6M25 10.6c-.6 4.2-1 9-1.4 13.2"
      stroke="#5d2f10" stroke-width="1.7" fill="none" stroke-linecap="round" opacity=".85"/>
    <path d="M8 15.5c3-3.5 8-5.2 13.5-4.6" stroke="#f0c58a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".55"/>
    <path d="M6.5 19c-.5-5 3-9.5 8.5-10.5 2.6-.5 5 -.4 7 .2-4.5.4-8.4 2-11 4.6-1.9 1.9-3.2 3.7-4.5 5.7z" fill="url(#sh)"/>
    <path d="M27.4 11.6c2.6 1.4 4.2 3.4 4.6 5.4.4 2-.4 3.6-1.6 4.8.4-3.4-.8-7-3-10.2z" fill="#e8b878" opacity=".8" stroke="#8a4a1d" stroke-width=".8"/>`,

  /* Bì: búi sợi thật sự, nhiều sợi mảnh xếp chồng + hạt thính rang. */
  bi: () => `
    <defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e9c4"/><stop offset="1" stop-color="#d9bd83"/></linearGradient></defs>
    <ellipse cx="20" cy="30" rx="14" ry="3" fill="#000" opacity=".12"/>
    <path d="M7 25c0-5 6-9 13-9s13 4 13 9c0 3-6 5-13 5S7 28 7 25z" fill="url(#bg1)"/>
    ${Array.from({ length: 14 }, (_, i) => {
      const y = 15 + (i % 7) * 1.9, x0 = 7 + (i % 3) * 2.2, w = 20 + (i % 4) * 3;
      return `<path d="M${x0} ${y + 5} q${w / 2} -${4 + (i % 3)} ${w} ${(i % 2) ? 1 : -1}"
        stroke="${i % 3 === 0 ? '#c9a566' : i % 3 === 1 ? '#eddcb0' : '#dcc389'}"
        stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".95"/>`;
    }).join('')}
    ${[[12, 21], [19, 19], [26, 22], [16, 25], [24, 26], [21, 23]].map(([x, y]) =>
      `<circle cx="${x}" cy="${y}" r=".9" fill="#9a7440"/>`).join('')}`,

  /* Chả trứng: miếng hình rẻ quạt, mặt trên trứng bóng vàng, thân có vân
     thịt và mộc nhĩ đen — ba dấu hiệu để nhận ra ngay. */
  cha: () => `
    <defs>
      <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e9b755"/><stop offset="1" stop-color="#c98b33"/></linearGradient>
      <linearGradient id="ct" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd95e"/><stop offset="1" stop-color="#f0b93c"/></linearGradient>
    </defs>
    <ellipse cx="20" cy="30" rx="13" ry="2.8" fill="#000" opacity=".12"/>
    <path d="M9 27 14.5 12h11L31 27z" fill="url(#cg)" stroke="#95611f" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M14.5 12h11l1.6 4.4H12.9z" fill="url(#ct)" stroke="#95611f" stroke-width=".9"/>
    <path d="M13.4 17.6h13.2" stroke="#a97528" stroke-width=".8" opacity=".6"/>
    ${[[15, 21], [23, 20], [19, 24], [26, 24], [12, 25]].map(([x, y], i) =>
      `<ellipse cx="${x}" cy="${y}" rx="${1.6 + i % 2 * .5}" ry="1.1" fill="#4a3526" opacity=".8" transform="rotate(${i * 33 - 40} ${x} ${y})"/>`).join('')}
    ${[[18, 18.6], [25, 22], [14, 23]].map(([x, y]) =>
      `<ellipse cx="${x}" cy="${y}" rx="1.4" ry=".8" fill="#f3e2bd" opacity=".7"/>`).join('')}
    <path d="M14.8 13.2h10.4" stroke="#fff2c0" stroke-width="1.2" opacity=".7" stroke-linecap="round"/>`,

  /* Đùi gà: giữ cục xương — giờ nó là dấu hiệu riêng, không đụng sườn nữa. */
  duiga: () => `
    <defs><radialGradient id="dg" cx=".38" cy=".3" r=".75">
      <stop offset="0" stop-color="#e0a458"/><stop offset=".6" stop-color="#c07f34"/><stop offset="1" stop-color="#93581f"/>
    </radialGradient></defs>
    <ellipse cx="22" cy="31" rx="13" ry="3" fill="#000" opacity=".13"/>
    <path d="M13 29c-4-2-5.5-7-3.5-11.5C11.8 12.4 17 9 22.5 9.4c6 .4 9.8 4.6 9.8 10 0 5.6-4.6 10-10.6 10.2-3.4.1-6.2-.2-8.7-.6z"
      fill="url(#dg)" stroke="#7a4517" stroke-width="1.1"/>
    <path d="M12.6 28.6c-2.6 2-4.4 3.6-5.4 5" stroke="#f6ecd8" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M12.6 28.6c-2.6 2-4.4 3.6-5.4 5" stroke="#d3c0a0" stroke-width="1" fill="none" stroke-linecap="round"/>
    <circle cx="6.6" cy="34" r="2.9" fill="#fbf4e6" stroke="#d3c0a0" stroke-width="1"/>
    <path d="M17 13c4-1.4 8 .4 9.6 4" stroke="#f2c584" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/>
    ${[[20, 17], [26, 21], [17, 23], [24, 26]].map(([x, y], i) =>
      `<ellipse cx="${x}" cy="${y}" rx="1.5" ry="1" fill="#6d3d12" opacity=".45" transform="rotate(${i * 40} ${x} ${y})"/>`).join('')}`
};

const rows = ['suon', 'duiga', 'bi', 'cha'];
document.getElementById('t').innerHTML =
  `<tr><th></th><th>cũ 46px</th><th>cũ 96px</th><th>mới 46px</th><th>mới 96px</th></tr>` +
  rows.map(k => {
    const n = (sz, fn) => `<span class="box"><svg viewBox="0 0 40 40" width="${sz}" height="${sz}">${fn}</svg></span>`;
    return `<tr>
      <td class="name">${ITEMS[k].n}</td>
      <td>${n(46, ITEM_ART[k](ITEMS[k].c))}</td>
      <td>${n(96, ITEM_ART[k](ITEMS[k].c))}</td>
      <td>${n(46, NEW[k]())}</td>
      <td>${n(96, NEW[k]())}</td>
    </tr>`;
  }).join('');
</script>
</body>
</html>
