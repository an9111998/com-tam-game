<script>
/* Đăng ký service worker để cài được lên màn hình chính và chơi offline.
   Chỉ chạy trên http/https — mở bằng file:// thì bỏ qua, không báo lỗi.

   Mở kèm ?nosw thì bỏ qua và dọn luôn bản đã đăng ký. Service worker
   dùng stale-while-revalidate nên lúc đang sửa code nó trả file cũ,
   khiến ta đi tìm lỗi ở chỗ không có lỗi. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  if (location.search.includes('nosw')) {
    navigator.serviceWorker.getRegistrations()
      .then(rs => rs.forEach(r => r.unregister()))
      .catch(() => { });
    if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => { });
  } else {
    addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => reg.update())
        .catch(() => { });
    });
  }
}
</script>
</body>
